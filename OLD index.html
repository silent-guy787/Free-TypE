<title>Free TypE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Cstyle%3E.a%7Bfill:%23F29227%7D.b%7Bfill:%23FF7344%7D.c%7Bfill:%23F05A28%7D.d%7Bfill:%237BD6C4%7D.e%7Bfill:%2372C0AB%7D.f%7Bfill:%23569080%7D.g%7Bfill:%23225B49%7D%3C/style%3E%3Cg%3E%3Cline%20class=%22f%22%20x1=%2224%22%20y1=%2220.251%22%20x2=%2229.962%22%20y2=%2216.789%22/%3E%3Cpath%20class=%22c%22%20d=%22M24,20.251l-3.783-2.184c0.157,0.343,0.261,0.696,0.296,1.055l2.75,1.605v1.966L24,23.119l5.963-3.464v-2.866L24,20.251z%22/%3E%3Cpath%20class=%22b%22%20d=%22M24.038,13.328l-4.9,2.807c0.275,0.477,0.862,1.459,1.079,1.932L24,20.251l5.962-3.462L24.038,13.328z%22/%3E%3Cline%20class=%22f%22%20x1=%2217.301%22%20y1=%2224.168%22%20x2=%2223.301%22%20y2=%2220.733%22/%3E%3Cpath%20class=%22a%22%20d=%22M20.513,19.122c0.353,3.581-4.427,5.096-6.214,2.001c-0.184-0.319-0.51-0.883-0.917-1.588l-2.081,1.192l6,3.464l5.963-3.464L20.513,19.122z%22/%3E%3Cpolygon%20class=%22b%22%20points=%2217.301,24.192%2011.301,20.727%2011.301,21.918%2015.962,24.668%2015.962,26.452%2017.301,27.059%2023.263,23.595%2023.263,20.727%22/%3E%3Cpolygon%20class=%22d%22%20points=%2210.05,31%204,27.536%204,24.668%2010.05,28.109%22/%3E%3Cline%20class=%22f%22%20x1=%2210.05%22%20y1=%2228.109%22%20x2=%2215.962%22%20y2=%2224.668%22/%3E%3Cpolygon%20class=%22e%22%20points=%224,24.668%2010.087,21.21%2015.962,24.668%2010.05,28.109%22/%3E%3Cpolygon%20class=%22f%22%20points=%2210.05,31%2015.962,27.536%2015.962,24.668%2010.05,28.109%22/%3E%3Cpath%20class=%22g%22%20d=%22M20.088,17.781L12.201,4.12C10.7,2.29,5.553,5.253,6.405,7.451c1.081,1.872,6.809,11.794,7.893,13.672C16.654,24.948,22.164,21.701,20.088,17.781z%22/%3E%3Cpath%20class=%22d%22%20d=%22M6.405,7.451L5.827,6.449c-0.851-2.195,4.289-5.166,5.796-3.331l0.579,1.002C10.7,2.29,5.553,5.253,6.405,7.451z%20M18.424,16.783c-2.918-1.219-4.172,3.557-1.036,3.932C15.14,19.773,16.024,16.497,18.424,16.783z%22/%3E%3C/g%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }

  :root {
    --background-color: #ffffff;
    --sidebar-bg: rgba(255, 255, 255, 0.8);
    --text-color: #18181b;
    --border-color: #e4e4e7;
    --hover-bg-color: #f4f4f5;
    --accent-color: #3b82f6;
    --sidebar-width: 260px;
    --header-height: 60px;
    --transition-speed: 0.3s;
    --toolbar-bg: #ffffff;
    --icon-color: #000000;
  }

.dark-mode, html.dark-mode {
    --background-color: #151515;
    --sidebar-bg: #111111;
    --text-color: #fafafa;
    --border-color: #27272a;
    --hover-bg-color: #232323;
    --toolbar-bg: #151515;
    --icon-color: #ffffff;
    --active-page-bg: #343434;
  }
  :root {
    --active-page-bg: rgba(59, 130, 246, 0.1);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 0;
    margin: 0;
    background-color: var(--background-color);
    color: var(--text-color);
    height: 100vh;
    overflow: hidden;
    transition: background-color var(--transition-speed);
    display: flex;
  }

  /* Sidebar Styles */
  #sidebar {
    position: fixed;
    top: 0;
    left: calc(-1 * var(--sidebar-width));
    width: var(--sidebar-width);
    height: 100%;
    background-color: var(--sidebar-bg);
    border-right: 1px solid var(--border-color);
    backdrop-filter: blur(12px);
    z-index: 1000;
    transition: left var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
    padding: 80px 16px 20px 16px;
    display: flex;
    flex-direction: column;
  }

  #sidebar.open {
    left: 0;
  }

  .sidebar-header {
    color: #a1a1aa;
    font-size: 11px;
    /*text-transform: uppercase;*/
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 12px;
    padding-left: 12px;
  }

  /* Fixed Toggle Button */
#sidebarToggle {
    position: fixed;
    top: 18px;
    left: 20px;
    width: 28px;
    height: 28px;
    z-index: 1100;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
  }
  #sidebarToggle.shifted {
    left: calc(var(--sidebar-width) - 78px);
  }
  #sidebarToggle svg {
    width: 18px;
    height: 18px;
  }
  #sidebarToggle:hover { background: var(--hover-bg-color); }
  #sidebarToggle svg { stroke: var(--icon-color); }

  /* App name label (shown top-left when sidebar is open) */
  #appNameLabel {
    position: fixed;
    top: 18px;
    left: 20px;
    height: 28px;
    display: none;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-color);
    cursor: pointer;
    user-select: none;
    z-index: 1100;
  }
  #appNameLabel.show { display: flex; }

  /* Add (New Page / New Folder) dropdown button, sits right after the sidebar toggle */
  #addMenuBtn {
    position: fixed;
    top: 18px;
    left: calc(var(--sidebar-width) - 44px);
    width: 28px;
    height: 28px;
    z-index: 1100;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #addMenuBtn.show { display: flex; }
  #addMenuBtn:hover { background: var(--hover-bg-color); }
  #addMenuBtn svg { width: 18px; height: 18px; stroke: var(--icon-color); }

  #addMenuDropdown {
    position: fixed;
    top: 50px;
    left: calc(var(--sidebar-width) - 44px);
    z-index: 1101;
  }

  /* Buttons */
.btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    width: 28px;
    height: 28px;
  }
  .btn-icon:hover { background: var(--hover-bg-color); }
  .btn-icon svg { 
    stroke: var(--icon-color);
    width: 18px;
    height: 18px;
  }

  #addPageBtn {
    background: transparent;
    border: none;
    padding: 10px 14px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    border-radius: 40px;
    color: var(--text-color);
    margin-bottom: 20px;
    transition: background 0.2s;
  }
  #addPageBtn:hover { background: var(--hover-bg-color); }

  /* Page List */
  #pagesList {
    flex: 1;
    overflow-y: auto;
  }

  .page-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 14px;
    transition: all 0.2s;
    group: relative;
  }
  .page-item:hover { background: var(--hover-bg-color); }
  .page-item.active {
    background-color: var(--active-page-bg);
    color: var(--accent-color);
    font-weight: 500;
  }
  .dark-mode .page-item.active {
    color: var(--text-color);
  }

  .page-item .more-btn {
    opacity: 0;
    padding: 4px;
    border-radius: 4px;
    transition: opacity 0.2s;
    background: transparent !important;
  }
  .page-item:hover .more-btn { opacity: 1; }

  /* Header */
  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--header-height);
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    z-index: 900;
    gap: 8px;
  }

  #wordCount {
    font-size: 12px;
    opacity: 0.6;
    margin-right: 8px;
  }

  /* App Modal */
  #appModalOverlay {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  #appModalOverlay.show { opacity: 1; pointer-events: auto; }
  #appModal {
    width: 100%;
    max-width: 400px;
    background: var(--toolbar-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 22px 22px 18px;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.25);
    transform: translateY(8px) scale(0.97);
    transition: transform 0.18s ease;
  }
  #appModalOverlay.show #appModal { transform: none; }
  #appModalTitle { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  #appModalMessage { margin: 0; font-size: 14px; line-height: 1.5; opacity: 0.75; word-break: break-word; }
  #appModalInput {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--text-color);
    background: var(--background-color);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #appModalInput:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }
  #appModalActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .app-modal-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: none;
    color: var(--text-color);
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .app-modal-btn:hover { background: var(--hover-bg-color); }
  .app-modal-btn.primary { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
  .app-modal-btn.primary:hover { background: var(--accent-color); opacity: 0.9; }
  .app-modal-btn.danger { background: #ef4444; border-color: #ef4444; color: #fff; }
  .app-modal-btn.danger:hover { background: #ef4444; opacity: 0.9; }
  .app-modal-btn:disabled { opacity: 0.4; cursor: default; }

  /* Context Menu */
  .context-menu {
    position: fixed;
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 6px;
    width: 120px;
    display: none;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    z-index: 2000;
  }
  .context-menu.show { display: block; }
  .context-item {
    background: none;
    border: none;
    padding: 8px 10px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-color);
    border-radius: 6px;
  }
  .context-item:hover { background: var(--hover-bg-color); }

  .context-menu-separator {
    height: 1px;
    background: var(--border-color);
    margin: 6px 0;
  }
  
  #downloadContextMenu {
    width: 200px;
  }

  /* Main Content */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: padding-left var(--transition-speed);
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  #editor {
    flex: 1;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 100px 40px 0 40px;
    outline: none;
    font-size: 16px;
    line-height: 1.7;
    overflow-y: visible;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .editor-spacer {
    height: 80px;
    width: 100%;
    pointer-events: none;
  }

  .placeholder::before {
    content: "";
    color: #3D3D41 /*#a1a1aa*/;
    pointer-events: none;
    position: absolute;
    top: 100px;
    left: 40px;
  }
  
  #editor {
    position: relative;
  }

  /* Bottom Toolbar */
  #toolbar {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 100px;
    display: flex;
    gap: 4px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    z-index: 1000;
    max-width: 95vw;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-color) var(--border-color);
  }

  /* WebKit custom scrollbar (Chrome, Safari, Edge) */
  #toolbar::-webkit-scrollbar {
    height: 4px;
  }

  #toolbar::-webkit-scrollbar-track {
    background: var(--border-color);
    border-radius: 10px;
    margin: 0 10px;
  }

  #toolbar::-webkit-scrollbar-thumb {
    background: var(--accent-color);
    border-radius: 10px;
  }

  #toolbar::-webkit-scrollbar-thumb:hover {
    background: var(--accent-color);
    opacity: 0.8;
  }

  /* Firefox custom scrollbar */
  #toolbar {
    scrollbar-width: thin;
    scrollbar-color: var(--accent-color) var(--border-color);
  }

  .toolbar-btn {
    background: none;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-color);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .toolbar-btn:hover { background: var(--hover-bg-color); }
.toolbar-btn.active { background: var(--hover-bg-color); color: var(--accent-color); }
.toolbar-btn svg { width: 18px; height: 18px; fill: currentColor; stroke: currentColor; display: block; }

  .toolbar-btn.is-disabled { opacity: 0.35; cursor: default; }
  .toolbar-btn.is-disabled:hover { background: none; }

  .font-size-control {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 4px;
  }
  .font-size-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-color);
    font-size: 16px;
    font-weight: 500;
    width: 24px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .font-size-btn:hover { background: var(--hover-bg-color); }
  .font-size-display {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-color);
    min-width: 28px;
    text-align: center;
    user-select: none;
  }

  /* Custom Tooltip */
  #custom-tooltip {
    position: fixed;
    background: #18181b;
    color: #fafafa;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 9999;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

#custom-tooltip::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 4px 4px 0 4px;
    border-style: solid;
    border-color: #18181b transparent transparent transparent;
  }
  #custom-tooltip.tooltip-below::after {
    bottom: auto;
    top: -4px;
    border-width: 0 4px 4px 4px;
    border-color: transparent transparent #18181b transparent;
  }
  .dark-mode #custom-tooltip.tooltip-below::after {
    border-color: transparent transparent #fafafa transparent;
  }

  .dark-mode #custom-tooltip {
    background: #fafafa;
    color: #18181b;
  }
  .dark-mode #custom-tooltip::after {
    border-color: #fafafa transparent transparent transparent;
  }

  /* Save/Copy Alerts */
  #toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #18181b;
    color: #fff;
    padding: 8px 16px;
    border-radius: 40px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 3000;
  }
  .dark-mode #toast { background: #fafafa; color: #18181b; }

  /* Menu Dropdown */
  #menuDropdown {
    position: absolute;
    top: 60px;
    right: 20px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 8px;
    min-width: 180px;
    display: none;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  }
  #menuDropdown.show { display: block; }
  .menu-item {
    background: none;
    border: none;
    padding: 10px 12px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-color);
    border-radius: 8px;
  }

.menu-item:hover { background: var(--hover-bg-color); }

  .menu-item-nightlight {
    cursor: default;
    user-select: none;
    justify-content: space-between;
  }
  .nightlight-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nl-switch {
    position: relative;
    display: inline-block;
    width: 30px;
    height: 17px;
    flex-shrink: 0;
  }
  .nl-switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 1;
  }
  .nl-switch-track {
    position: absolute;
    inset: 0;
    background: var(--border-color);
    border-radius: 999px;
    transition: background 0.2s;
  }
  .nl-switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .nl-switch input:checked ~ .nl-switch-track {
    background: #f97316;
  }
  .nl-switch input:checked ~ .nl-switch-track .nl-switch-thumb {
    transform: translateX(13px);
  }
  .nightlight-slider {
    width: 64px;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 4px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
    accent-color: #f97316;
  }
  .nightlight-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f97316;
    cursor: pointer;
  }
  .nightlight-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f97316;
    cursor: pointer;
    border: none;
  }

  /* Typeface picker */
  .typeface-check { opacity: 0; font-size: 13px; color: var(--accent-color); }
  .typeface-option.active .typeface-check { opacity: 1; }

#night-light-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    background: transparent;
    transition: background 0.4s ease;
  }

  /* Storage Indicator */
#storageIndicator {
    position: fixed;
    bottom: 14px;
    left: 20px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-color);
    opacity: 0.45;
    pointer-events: none;
    z-index: 800;
    letter-spacing: 0.01em;
    transition: opacity 0.2s;
    line-height: 1.5;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #storageIndicator:hover { opacity: 0.75; }
  #storageIndicator svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    fill: currentColor;
  }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .menu-shortcut {
    font-size: 11px;
    color: #a1a1aa;
    opacity: 0;
    transition: opacity 0.15s ease;
    white-space: nowrap;
  }
  .menu-item:hover .menu-shortcut { opacity: 1; }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: padding-left var(--transition-speed);
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .editor-spacer {
    height: 80px;
    width: 100%;
    flex-shrink: 0;
    pointer-events: none;
  }

html {
    scroll-behavior: smooth;
  }

  /* Custom Scrollbar — hidden unless actively scrolling */
  #main::-webkit-scrollbar {
    width: 4px;
  }
  #main::-webkit-scrollbar-track {
    background: transparent;
  }
  #main::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 999px;
    transition: background 0.3s ease;
  }
  #main.scrolling::-webkit-scrollbar-thumb {
    background: #71717a;
  }
  #main.scrolling::-webkit-scrollbar-thumb:hover {
    background: #a1a1aa;
  }
  #main {
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
    transition: scrollbar-color 0.3s ease;
  }
  #main.scrolling {
    scrollbar-color: #71717a transparent;
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: padding-left var(--transition-speed);
    overflow-y: auto;
    scroll-behavior: smooth;
  }


  /* Folder tree */
  .folder-item { gap: 6px; }
  .folder-add-page-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text-color);
    opacity: 0.55;
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 0.2s, opacity 0.2s;
  }
  .folder-add-page-btn:hover { background: var(--hover-bg-color); opacity: 1; }

  /* Editor typeface options (typing area only) */
  #editor.font-serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
  #editor.font-mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  #editor.font-sans { font-family: sans-serif; }
  #editor.font-cursive { font-family: cursive; }

  #editor.font-helvetica { font-family: Helvetica, Arial, sans-serif; }

  #editor.font-tahoma { font-family: Tahoma, Geneva, sans-serif; }
  #editor.font-trebuchet { font-family: 'Trebuchet MS', Helvetica, sans-serif; }

  #editor.font-georgia { font-family: Georgia, serif; }
  #editor.font-garamond { font-family: Garamond, 'EB Garamond', 'Times New Roman', serif; }
  #editor.font-palatino { font-family: Palatino, 'Palatino Linotype', 'Book Antiqua', serif; }
  #editor.font-courier { font-family: 'Courier New', Courier, monospace; }

  <button class="context-item" id="deletePageBtn" style="color: #ef4444;">Delete</button>
</div>

<div id="downloadContextMenu" class="context-menu">
  <button class="context-item" id="downloadTxtBtn">Download as Text (.txt)</button>
  <button class="context-item" id="downloadMdBtn">Download as Markdown (.md)</button>
  <button class="context-item" id="downloadRtfBtn">Download as Rich Text (.rtf)</button>
<button class="context-item" id="downloadHtmlBtn">Download as HTML (.html)</button>
  <div class="context-menu-separator"></div>
  <button class="context-item" id="exportBackupBtn">Export a Backup (JSON)</button>
  <button class="context-item" id="importBackupBtn">Import a Backup (JSON)</button>
</div>

<div id="appModalOverlay" aria-hidden="true">
  <div id="appModal" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
    <h3 id="appModalTitle"></h3>
    <p id="appModalMessage"></p>
    <input id="appModalInput" type="text" autocomplete="off" spellcheck="false" />
    <div id="appModalActions">
      <button class="app-modal-btn" id="appModalCancel">Cancel</button>
      <button class="app-modal-btn primary" id="appModalOk">OK</button>
    </div>
  </div>
</div>

<div id="toast">Message</div>
<div id="night-light-overlay"></div>
<div id="storageIndicator" title="IndexedDB storage usage"><span id="storageText">— / —</span></div>
<div id="custom-tooltip"></div>

<script>
const Utils = {
    generateUUID: function () {
        if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }
};

</script>
<script>
  (function(){
    // DB & State
    const DB_NAME = 'NotebookDB_v2';
    const DB_VERSION = 2;
    const STORE_NAME = 'state';       // 'appState' -> settings + page tree (no page bodies)
    const CONTENT_STORE = 'content';  // <pageId> -> page HTML, one record per page
    let db = null;
    
    let pages = [];
    let currentPageId = null;
    let isDarkMode = false;
    let isSidebarOpen = false;
    let contextItemId = null;
    let isCounterVisible = true;
    let isToolbarVisible = true;
    let isSpellcheckEnabled = false;
    let isNightLightEnabled = false;
    let nightLightIntensity = 40;
    let isStorageVisible = true;
    let pageCounter = 1;
    let folderCounter = 1;
    let editorTypeface = 'default';

    // ── Tree helpers ──────────────────────────────────────────────
    function findItemById(list, id) {
      for (const item of list) {
        if (item.id === id) return item;
        if (item.type === 'folder' && item.children) {
          const found = findItemById(item.children, id);
          if (found) return found;
        }
      }
      return null;
    }
    function findParentList(list, id, parentList) {
      for (const item of list) {
        if (item.id === id) return list;
        if (item.type === 'folder' && item.children) {
          const found = findParentList(item.children, id);
          if (found) return found;
        }
      }
      return null;
    }
    function flattenPages(list) {
      let out = [];
      for (const item of list) {
        if (item.type === 'folder') {
          if (item.children) out = out.concat(flattenPages(item.children));
        } else {
          out.push(item);
        }
      }
      return out;
    }
    function getCurrentPage() {
      return findItemById(pages, currentPageId);
    }
    // Migrate legacy data (no id/type, flat pages array, index-based) to the new model
    function migratePages() {
      let changed = false;
      pages.forEach(p => {
        if (!p.id) { p.id = Utils.generateUUID(); changed = true; }
        if (!p.type) { p.type = 'folder' in p ? p.type : 'page'; changed = true; }
      });
      if (pages.length === 0) {
        pages.push({ id: Utils.generateUUID(), type: 'page', name: 'Page 1', content: '' });
        changed = true;
      }
      return changed;
    }

    const editor = document.getElementById('editor');
    const pagesList = document.getElementById('pagesList');
    const toast = document.getElementById('toast');

    // ── PERSISTENCE (IndexedDB) ─────────────────────────────────────
    // • Each page body is its own record, so typing only rewrites the page being edited
    //   (the old design re-wrote every page on every change).
    // • Writes are debounced (with a max wait) and flushed when the tab is hidden or closed.
    // • Everything that changed is written in ONE transaction, so it's all-or-nothing.
    // • Old single-record data is migrated automatically on first load.
    // • If storage can't be opened/read, autosave pauses instead of overwriting good data.
    const SAVE_DEBOUNCE = 500;     // ms of quiet before writing
    const SAVE_MAX_WAIT = 3000;    // never hold changes longer than this
    let dbMode = 'none';           // 'idb' | 'memory'
    let loadOK = false;            // true once saved data was read (or storage is intentionally absent)
    let needsMigrationSave = false;
    let storagePersisted = null;
    let dirty = false, saveTimer = null, maxTimer = null, retryTimer = null, failCount = 0;
    let writeChain = Promise.resolve();
    const savedContent = new Map();        // pageId -> content last written
    const knownContentIds = new Set();     // ids that have a content record on disk
    let savedMetaJSON = null;
    const tabId = Utils.generateUUID();
    let syncChannel = null;
    let lastSyncWarn = 0;

    function initDB() {
      return new Promise((resolve) => {
        if (!('indexedDB' in window) || !window.indexedDB) { dbMode = 'memory'; return resolve(); }
        let request;
        try { request = indexedDB.open(DB_NAME, DB_VERSION); }
        catch (e) { dbMode = 'memory'; return resolve(); }
        request.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME);
          if (!d.objectStoreNames.contains(CONTENT_STORE)) d.createObjectStore(CONTENT_STORE);
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          dbMode = 'idb';
          // Another tab wants to upgrade/delete the database: let go so it isn't blocked.
          db.onversionchange = () => {
            try { db.close(); } catch (_) {}
            db = null; loadOK = false;
            showToast('Notebook updated in another tab. Please reload.');
          };
          db.onclose = () => { db = null; };
          resolve();
        };
        request.onblocked = () => showToast('Close other Free TypE tabs to finish updating storage.');
        request.onerror = () => { dbMode = 'memory'; resolve(); };
      });
    }

    async function requestPersistence() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          storagePersisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
        }
      } catch (_) {}
    }

    function isFolderItem(it) { return it && it.type === 'folder'; }
    function stripContent(list) {
      return (list || []).map(it => {
        if (isFolderItem(it)) return Object.assign({}, it, { children: stripContent(it.children) });
        const copy = Object.assign({}, it);
        delete copy.content;
        return copy;
      });
    }
    function buildMeta() {
      return {
        schemaVersion: 2,
        pages: stripContent(pages),
        currentPageId, isDarkMode, isCounterVisible, isToolbarVisible, isSpellcheckEnabled,
        isNightLightEnabled, nightLightIntensity, isStorageVisible, pageCounter, folderCounter, editorTypeface
      };
    }

    const ZW_SPAN = /<span[^>]*>\u200B<\/span>/g;
    // Copy the editor into the current page (zero-width anchor spans are dropped from the saved copy only)
    function captureEditor() {
      const curP = getCurrentPage();
      if (!curP) return;
      const html = editor.innerHTML;
      curP.content = html.indexOf('\u200B') === -1 ? html : html.replace(ZW_SPAN, '');
    }

    // Called after every change: capture immediately, write to disk shortly after.
    function saveState() {
      if (!loadOK) return Promise.resolve();
      captureEditor();
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE);
      if (!maxTimer) maxTimer = setTimeout(flushSave, SAVE_MAX_WAIT);
      return Promise.resolve();
    }
    // Capture + write right now (used by backup export/import)
    async function saveNow() { await saveState(); return flushSave(); }

    async function writeNow() {
      if (!db) return;
      const metaObj = buildMeta();
      const metaJSON = JSON.stringify(metaObj);
      const ids = new Set();
      const changed = [];
      flattenPages(pages).forEach(pg => {
        ids.add(pg.id);
        const c = pg.content || '';
        if (savedContent.get(pg.id) !== c) changed.push([pg.id, c]);
      });
      const removed = [...knownContentIds].filter(id => !ids.has(id));
      const metaChanged = metaJSON !== savedMetaJSON;
      if (!changed.length && !removed.length && !metaChanged) return;

      await new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, CONTENT_STORE], 'readwrite');
        const cs = tx.objectStore(CONTENT_STORE);
        changed.forEach(([id, c]) => cs.put(c, id));
        removed.forEach(id => cs.delete(id));
        if (metaChanged) tx.objectStore(STORE_NAME).put(metaObj, 'appState');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });

      changed.forEach(([id, c]) => { savedContent.set(id, c); knownContentIds.add(id); });
      removed.forEach(id => { savedContent.delete(id); knownContentIds.delete(id); });
      savedMetaJSON = metaJSON;
      try { if (syncChannel) syncChannel.postMessage({ tab: tabId }); } catch (_) {}
    }

    function flushSave() {
      clearTimeout(saveTimer); clearTimeout(maxTimer);
      saveTimer = maxTimer = null;
      if (!dirty) return writeChain;
      dirty = false;
      writeChain = writeChain.then(writeNow).then(() => { failCount = 0; }).catch(err => {
        console.error('Save failed:', err);
        dirty = true;
        failCount++;
        if (err && err.name === 'QuotaExceededError') showToast('Storage is full. Export a backup to keep your notes safe.');
        else if (failCount === 1) showToast('Couldn\u2019t save. Retrying\u2026');
        clearTimeout(retryTimer);
        retryTimer = setTimeout(flushSave, Math.min(30000, 1000 * Math.pow(2, failCount)));
      });
      return writeChain;
    }

    function flushOnExit() {
      if (loadOK) { captureEditor(); dirty = true; }
      flushSave();
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushOnExit();
    });
    window.addEventListener('pagehide', flushOnExit);

    try {
      if ('BroadcastChannel' in window) {
        syncChannel = new BroadcastChannel('freetype_sync');
        syncChannel.onmessage = (e) => {
          if (e.data && e.data.tab !== tabId && Date.now() - lastSyncWarn > 30000) {
            lastSyncWarn = Date.now();
            showToast('Notebook changed in another tab. Reload to see the latest.');
          }
        };
      }
    } catch (_) {}

    async function loadState() {
      if (dbMode !== 'idb' || !db) { loadOK = true; return null; }   // memory mode: nothing to read
      try {
        const [meta, keys, vals] = await new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME, CONTENT_STORE], 'readonly');
          const r1 = tx.objectStore(STORE_NAME).get('appState');
          const r2 = tx.objectStore(CONTENT_STORE).getAllKeys();
          const r3 = tx.objectStore(CONTENT_STORE).getAll();
          tx.oncomplete = () => resolve([r1.result, r2.result, r3.result]);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error || new Error('Read aborted'));
        });
        loadOK = true;
        if (!meta) return null;

        const bodies = new Map();
        keys.forEach((k, i) => { bodies.set(k, vals[i]); knownContentIds.add(k); });
        const legacy = meta.schemaVersion !== 2;     // v1: page bodies were stored inline
        const attach = (list) => (list || []).forEach(it => {
          if (isFolderItem(it)) { attach(it.children); return; }
          if (legacy) { if (typeof it.content !== 'string') it.content = ''; }
          else { it.content = bodies.has(it.id) ? bodies.get(it.id) : ''; savedContent.set(it.id, it.content); }
        });
        attach(meta.pages);
        if (legacy) needsMigrationSave = true;       // rewrite in the new layout after startup
        return meta;
      } catch (err) {
        console.error('Load failed:', err);
        loadOK = false;   // keep autosave OFF so a blank state never overwrites real data
        showToast('Couldn\u2019t read saved notes. Autosave is paused to protect them. Try reloading.');
        return null;
      }
    }
    // ── END PERSISTENCE ─────────────────────────────────────────────

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => toast.style.opacity = '0', 2000);
    }

    // Command wrapper
    window.execCmd = (cmd) => {
      document.execCommand(cmd, false, null);
      editor.focus();
      recordHistory(null, true);
      saveState();
    };

    function updateWordCount() {
      let text = editor.innerText || '';
      // Remove any zero-width spaces, newlines, and trim
      text = text.replace(/[\n\r\u200B]/g, '').trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = text.length;
      document.getElementById('wordCount').textContent = `${words} words, ${chars} characters`;
    }

    function renderItemList(list, container, depth) {
      list.forEach((item) => {
        if (item.type === 'folder') {
          const div = document.createElement('div');
          div.className = 'page-item folder-item';
          div.style.paddingLeft = (12 + depth * 16) + 'px';
          div.innerHTML = `
            <svg class="folder-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; transform:rotate(${item.open ? '90deg' : '0deg'}); transition:transform .15s;"><polyline points="9 18 15 12 9 6"></polyline></svg>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path></svg>
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</span>
            <button class="btn-icon more-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
          `;
          div.onclick = () => {
            item.open = !item.open;
            updateUI();
            saveState();
          };
          const mBtn = div.querySelector('.more-btn');
          mBtn.onclick = (e) => {
            e.stopPropagation();
            const rect = mBtn.getBoundingClientRect();
            showContextMenu(item.id, 'folder', rect.left, rect.top);
          };
          container.appendChild(div);

          if (item.open) {
            if (!item.children) item.children = [];
            renderItemList(item.children, container, depth + 1);

            const addDiv = document.createElement('button');
            addDiv.className = 'folder-add-page-btn';
            addDiv.style.paddingLeft = (32 + depth * 16) + 'px';
            addDiv.textContent = '+ Add Page';
            addDiv.onclick = (e) => {
              e.stopPropagation();
              addNewPage(item.id);
            };
            container.appendChild(addDiv);
          }
        } else {
          const div = document.createElement('div');
          div.className = `page-item ${item.id === currentPageId ? 'active' : ''}`;
          div.style.paddingLeft = (12 + depth * 16) + 'px';
          div.innerHTML = `
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</span>
            <button class="btn-icon more-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
          `;
          div.onclick = () => switchPage(item.id);
          const mBtn = div.querySelector('.more-btn');
          mBtn.onclick = (e) => {
            e.stopPropagation();
            const rect = mBtn.getBoundingClientRect();
            showContextMenu(item.id, 'page', rect.left, rect.top);
          };
          container.appendChild(div);
        }
      });
    }

    function updateUI() {
// Theme
      document.documentElement.classList.toggle('dark-mode', isDarkMode);
      document.body.classList.toggle('dark-mode', isDarkMode);
      
      // Sidebar
      document.getElementById('sidebar').classList.toggle('open', isSidebarOpen);
      document.getElementById('sidebarToggle').classList.toggle('shifted', isSidebarOpen);
      document.getElementById('appNameLabel').classList.toggle('show', isSidebarOpen);
      document.getElementById('addMenuBtn').classList.toggle('show', isSidebarOpen);
      if (!isSidebarOpen) {
        document.getElementById('addMenuDropdown').classList.remove('show');
      }
      
      // Page List
      pagesList.innerHTML = '';
      renderItemList(pages, pagesList, 0);

document.getElementById('wordCount').style.display = isCounterVisible ? '' : 'none';
      document.getElementById('toolbar').style.display = isToolbarVisible ? '' : 'none';
      document.getElementById('toggleCounterBtn').innerHTML = (isCounterVisible ? 'Hide Counter' : 'Show Counter') + ' <span class="menu-shortcut">Ctrl+Shift+Y</span>';
document.getElementById('toggleToolbarBtn').innerHTML = (isToolbarVisible ? 'Hide Toolbar' : 'Show Toolbar') + ' <span class="menu-shortcut">Ctrl+Shift+L</span>';
      const storageEl = document.getElementById('storageIndicator');
      if (storageEl) storageEl.style.display = isStorageVisible ? '' : 'none';
      document.getElementById('toggleStorageBtn').innerHTML = (isStorageVisible ? 'Hide Storage' : 'Show Storage') + ' <span class="menu-shortcut"></span>';
editor.spellcheck = isSpellcheckEnabled;
      document.getElementById('toggleSpellcheckBtn').innerHTML = (isSpellcheckEnabled ? 'Disable Spell Check' : 'Enable Spell Check') + ' <span class="menu-shortcut">Ctrl+Shift+S</span>';
      const overlay = document.getElementById('night-light-overlay');
      const slider = document.getElementById('nightLightSlider');
      const toggle = document.getElementById('nightLightToggle');
      slider.value = nightLightIntensity;
      toggle.checked = isNightLightEnabled;
      if (isNightLightEnabled) {
        const alpha = (nightLightIntensity / 100) * 0.65;
        overlay.style.background = `rgba(255, 147, 41, ${alpha})`;
      } else {
        overlay.style.background = 'transparent';
      }

      // Typeface
      document.querySelectorAll('.typeface-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.face === editorTypeface);
      });
      const activeFace = document.querySelector(`.typeface-option[data-face="${editorTypeface}"]`);
      const faceLabel = activeFace ? activeFace.dataset.label : 'Default';
      const tfLabel = document.getElementById('typefaceCurrentLabel');
      if (tfLabel) tfLabel.textContent = faceLabel + ' ›';
      updateWordCount();
    }

    function switchPage(id) {
      saveState();
      currentPageId = id;
      const p = getCurrentPage();
editor.innerHTML = p ? p.content : '';
if (editor.innerText.replace(/\u200B/g, '').trim() === '') {
        editor.innerHTML = '';
        currentFontSize = 16;
        document.getElementById('fontSizeDisplay').textContent = 16;
        editor.classList.add('placeholder');
      }
      const isEmpty = editor.innerText.replace(/\u200B/g, '').trim() === "";
      editor.classList.toggle('placeholder', isEmpty);
      // Scroll the main container to top when switching pages
document.getElementById('main').scrollTop = 0;
      updateUI();
      initHistory();
    }

    function showContextMenu(id, type, x, y) {
      contextItemId = id;
      const menu = document.getElementById('pageContextMenu');
      menu.dataset.itemType = type;
      menu.style.left = `${x + 20}px`;
      menu.style.top = `${y}px`;
      menu.classList.add('show');
    }

    // Events
    document.getElementById('sidebarToggle').onclick = () => {
      isSidebarOpen = !isSidebarOpen;
      updateUI();
    };

    document.getElementById('appNameLabel').onclick = () => {
      location.reload();
    };

    document.getElementById('addMenuBtn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('addMenuDropdown').classList.toggle('show');
    };

    document.getElementById('newPageMenuBtn').onclick = () => {
      document.getElementById('addMenuDropdown').classList.remove('show');
      addNewPage();
    };

    document.getElementById('newFolderMenuBtn').onclick = () => {
      document.getElementById('addMenuDropdown').classList.remove('show');
      addNewFolder();
    };

    function addNewPage(parentFolderId) {
      const newPage = {
        id: Utils.generateUUID(),
        type: 'page',
        name: `Page ${pageCounter++}`,
        content: ''
      };
      if (parentFolderId) {
        const folder = findItemById(pages, parentFolderId);
        folder.children = folder.children || [];
        folder.children.push(newPage);
        folder.open = true;
      } else {
        pages.push(newPage);
      }
      switchPage(newPage.id);
    }

    function addNewFolder() {
      const newFolder = {
        id: Utils.generateUUID(),
        type: 'folder',
        name: `Folder ${folderCounter++}`,
        open: true,
        children: []
      };
      pages.push(newFolder);
      updateUI();
      saveState();
    }

    document.getElementById('copyBtn').onclick = () => {
      const text = editor.innerText;
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast('Copied to clipboard');
    };


    document.getElementById('menuToggle').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('menuDropdown').classList.toggle('show');
    };

    // Download button context menu
    let downloadContextMenu = document.getElementById('downloadContextMenu');
    
    document.getElementById('downloadBtn').onclick = (e) => {
      e.stopPropagation();
      const rect = e.currentTarget.getBoundingClientRect();
      downloadContextMenu.style.left = `${rect.right - 200}px`;
      downloadContextMenu.style.top = `${rect.bottom + 5}px`;
      downloadContextMenu.classList.toggle('show');
    };
    
    // Download as Text
    document.getElementById('downloadTxtBtn').onclick = () => {
      const content = editor.innerText;
      const pageName = getCurrentPage().name;
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${pageName}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded "${pageName}.txt"`);
      downloadContextMenu.classList.remove('show');
    };
    
    // Download as Markdown
    document.getElementById('downloadMdBtn').onclick = () => {
      const content = editor.innerText;
      const pageName = getCurrentPage().name;
      const blob = new Blob([content], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${pageName}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded "${pageName}.md"`);
      downloadContextMenu.classList.remove('show');
    };


    // Download as RTF
    document.getElementById('downloadRtfBtn').onclick = () => {
      const pageName = getCurrentPage().name;
      const html = editor.innerHTML;

      // Convert basic HTML to RTF
      const div = document.createElement('div');
      div.innerHTML = html;

      let rtf = '{\\rtf1\\ansi\\deff0\n';
      rtf += '{\\fonttbl{\\f0 Times New Roman;}}\n';
      rtf += '{\\colortbl;\\red0\\green0\\blue0;}\n';

      function nodeToRtf(node) {
        if (node.nodeType === 3) {
          return node.textContent
            .replace(/\\/g, '\\\\')
            .replace(/\{/g, '\\{')
            .replace(/\}/g, '\\}')
            .replace(/\n/g, '\\par\n');
        }
        let out = '';
        const tag = node.nodeName.toLowerCase();
        const style = node.style || {};
        let prefix = '', suffix = '';

        if (tag === 'b' || tag === 'strong') { prefix += '\\b '; suffix = '\\b0 ' + suffix; }
        if (tag === 'i' || tag === 'em') { prefix += '\\i '; suffix = '\\i0 ' + suffix; }
        if (tag === 'u') { prefix += '\\ul '; suffix = '\\ulnone ' + suffix; }
        if (tag === 's' || tag === 'strike') { prefix += '\\strike '; suffix = '\\strike0 ' + suffix; }
        if (tag === 'p' || tag === 'div' || tag === 'br') { suffix += '\\par\n'; }
        if (tag === 'li') { prefix += '\\bullet\\tab '; suffix += '\\par\n'; }

        if (style.fontSize) {
          const pt = Math.round(parseFloat(style.fontSize) * 1.333);
          prefix += `\\fs${pt * 2} `;
        }

        out += prefix;
        node.childNodes.forEach(child => { out += nodeToRtf(child); });
        out += suffix;
        return out;
      }

      div.childNodes.forEach(child => { rtf += nodeToRtf(child); });
      rtf += '}';

      const blob = new Blob([rtf], { type: 'application/rtf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${pageName}.rtf`;
      document.body.appendChild(a);
      a.click();

    function formatBytes(bytes) {

      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';

const STORAGE_ICON = `<svg viewBox="0 0 36 36" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><path d="M33,6.69h0c-.18-3.41-9.47-4.33-15-4.33S3,3.29,3,6.78V29.37c0,3.49,9.43,4.43,15,4.43s15-.93,15-4.43V6.78s0,0,0,0S33,6.7,33,6.69Zm-2,7.56c-.33.86-5.06,2.45-13,2.45A37.45,37.45,0,0,1,7,15.34v2.08A43.32,43.32,0,0,0,18,18.7c4,0,9.93-.48,13-2v5.17c-.33.86-5.06,2.45-13,2.45A37.45,37.45,0,0,1,7,22.92V25a43.32,43.32,0,0,0,11,1.28c4,0,9.93-.48,13-2v5.1c-.35.86-5.08,2.45-13,2.45S5.3,30.2,5,29.37V6.82C5.3,6,10,4.36,18,4.36c7.77,0,12.46,1.53,13,2.37-.52.87-5.21,2.39-13,2.39A37.6,37.6,0,0,1,7,7.76V9.85a43.53,43.53,0,0,0,11,1.27c4,0,9.93-.48,13-2Z"/><rect x="0" y="0" width="36" height="36" fill-opacity="0"/></svg>`;

    async function updateStorageIndicator() {

      if (!el.querySelector('svg')) {

      }

      if (!navigator.storage || !navigator.storage.estimate) {
        textEl.textContent = 'Storage unavailable';
        return;
      }
      try {
        const { usage, quota } = await navigator.storage.estimate();
        const used = formatBytes(usage || 0);
        const left = formatBytes((quota || 0) - (usage || 0));
        textEl.textContent = `${used} used · ${left} left`;
        el.title = `Total quota: ${formatBytes(quota || 0)}` + (storagePersisted ? ' \u00b7 Protected from automatic cleanup' : '');

      const input   = document.getElementById('appModalInput');
      const okBtn   = document.getElementById('appModalOk');
      const cancelBtn = document.getElementById('appModalCancel');
      let done = null;

      function close(result) {
        if (!done) return;
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
        const cb = done; done = null;
        cb(result);
      }

      // opts: { title, message, confirmText, cancelText (null = no cancel button), danger, input: { value, placeholder } }
      function open(opts) {
        if (done) close(null);
        titleEl.textContent = opts.title || '';
        msgEl.textContent = opts.message || '';
        msgEl.style.display = opts.message ? '' : 'none';
        okBtn.textContent = opts.confirmText || 'OK';
        okBtn.className = 'app-modal-btn ' + (opts.danger ? 'danger' : 'primary');
        cancelBtn.textContent = opts.cancelText || 'Cancel';
        cancelBtn.style.display = opts.cancelText === null ? 'none' : '';
        const hasInput = !!opts.input;
        input.style.display = hasInput ? '' : 'none';
        if (hasInput) {
          input.value = opts.input.value || '';
          input.placeholder = opts.input.placeholder || '';
        }
        const validate = () => { okBtn.disabled = hasInput && input.value.trim() === ''; };
        input.oninput = validate;
        validate();

        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        setTimeout(() => {
          if (hasInput) { input.focus(); input.select(); } else { okBtn.focus(); }
        }, 30);

        return new Promise(resolve => {
          done = resolve;
          okBtn.onclick = () => { if (!okBtn.disabled) close(hasInput ? input.value.trim() : true); };
          cancelBtn.onclick = () => close(hasInput ? null : false);
          overlay.onmousedown = (e) => { if (e.target === overlay) close(hasInput ? null : false); };
          overlay.onkeydown = (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') { e.preventDefault(); close(hasInput ? null : false); }
            else if (e.key === 'Enter' && e.target !== cancelBtn) { e.preventDefault(); okBtn.click(); }
            else if (e.key === 'Tab') {
              const f = [input, cancelBtn, okBtn].filter(el => el.style.display !== 'none' && !el.disabled);
              if (!f.length) return;
              const i = f.indexOf(document.activeElement);
              e.preventDefault();
              f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
            }
          };
        });
      }

      return {
        alert:   (title, message) => open({ title, message, cancelText: null }).then(() => undefined),
        confirm: (title, message, confirmText, danger) => open({ title, message, confirmText, danger }),
        prompt:  (title, value, confirmText, placeholder) => open({ title, confirmText, input: { value, placeholder } })

// Font Size Control
    let currentFontSize = 16;
    let pendingFontSize = null;
    const MIN_FONT = 1;
    const MAX_FONT = 30;

    function applyFontSize(size) {
      currentFontSize = Math.min(MAX_FONT, Math.max(MIN_FONT, size));
      document.getElementById('fontSizeDisplay').textContent = currentFontSize;
      editor.focus();

      const selection = window.getSelection();
      if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
        const range = selection.getRangeAt(0);
        const span = document.createElement('span');
        span.style.fontSize = currentFontSize + 'px';
        try {
          range.surroundContents(span);
        } catch(e) {
          // If surroundContents fails (crosses nodes), use extractContents
          const fragment = range.extractContents();
          span.appendChild(fragment);
          range.insertNode(span);
        }
        selection.removeAllRanges();
        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        selection.addRange(newRange);
        recordHistory(null, true);
} else {
        // No selection — just store size, apply on next keypress
        pendingFontSize = currentFontSize;
      }
      saveState();
    }

    function detectFontSize() {
      const selection = window.getSelection();
      if (selection && selection.rangeCount > 0) {
        const node = selection.anchorNode;
        const el = node?.nodeType === 3 ? node.parentElement : node;
        if (el) {
          const size = parseFloat(window.getComputedStyle(el).fontSize);
          if (!isNaN(size)) {
            currentFontSize = Math.round(size);
            document.getElementById('fontSizeDisplay').textContent = currentFontSize;
          }
        }
      }
    }

    // Re-check cursor position after any navigation key
    editor.addEventListener('keyup', (e) => {
      if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight',
           'Enter', 'End', 'PageDown', 'Home', 'PageUp'].includes(e.key)) {
        requestAnimationFrame(scrollCursorAboveToolbar);
      }
    });

    editor.addEventListener('keydown', (e) => {
      if (pendingFontSize === null) return;
      if (e.key.length !== 1) return; // only printable characters
      if (e.ctrlKey || e.metaKey || e.altKey) return; // let shortcuts (Ctrl+Z, Ctrl+B...) through
      e.preventDefault();
      const span = document.createElement('span');
      span.style.fontSize = pendingFontSize + 'px';
      span.textContent = e.key;
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(span);
        range.setStartAfter(span);
        range.setEndAfter(span);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      pendingFontSize = null;
      recordHistory(null, true);
      saveState();
    });

editor.addEventListener('input', () => {
      if (editor.innerText.trim() === '') {
        editor.innerHTML = '';
        currentFontSize = 16;
        pendingFontSize = null;
        document.getElementById('fontSizeDisplay').textContent = 16;
        editor.classList.add('placeholder');
      }
    });



    // ── UNDO / REDO ─────────────────────────────────────────────────
    // Custom per-page history. Native undo can't track the font-size
    // changes (they edit the DOM directly), so we snapshot the editor.
    const histories = new Map();          // pageId -> { undo, redo, present, lastT, lastType, groupStart }
    const HISTORY_LIMIT = 100;
    const MERGE_TYPES = ['insertText', 'insertCompositionText', 'deleteContentBackward', 'deleteContentForward'];

    function textOffset(node, off) {
      const r = document.createRange();
      r.selectNodeContents(editor);
      try { r.setEnd(node, off); } catch (_) { return 0; }
      return r.toString().length;
    }
    function getSelOffsets() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
      const r = sel.getRangeAt(0);
      return { s: textOffset(r.startContainer, r.startOffset), e: textOffset(r.endContainer, r.endOffset) };
    }
    function locate(offset) {
      const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
      let n = 0, t, last = null;
      while ((t = w.nextNode())) {
        last = t;
        if (offset <= n + t.nodeValue.length) return { node: t, off: offset - n };
        n += t.nodeValue.length;
      }
      return last ? { node: last, off: last.nodeValue.length } : { node: editor, off: 0 };
    }
    function setSelOffsets(o) {
      const sel = window.getSelection();
      const r = document.createRange();
      if (!o) {
        r.selectNodeContents(editor);
        r.collapse(false);
      } else {
        const a = locate(o.s), b = locate(o.e);
        r.setStart(a.node, a.off);
        r.setEnd(b.node, b.off);
      }
      sel.removeAllRanges();
      sel.addRange(r);
    }
    function snapshot() { return { html: editor.innerHTML, sel: getSelOffsets() }; }
    function curHistory() { return currentPageId ? histories.get(currentPageId) : null; }

    function initHistory() {
      if (!currentPageId) return;
      let h = histories.get(currentPageId);
      if (!h || h.present.html !== editor.innerHTML) {
        h = { undo: [], redo: [], present: { html: editor.innerHTML, sel: null }, lastT: 0, lastType: null, groupStart: 0 };
        histories.set(currentPageId, h);
      }
      h.lastType = null;
      updateHistoryButtons();
    }

    function recordHistory(type, force) {
      const h = curHistory();
      if (!h) return;
      const html = editor.innerHTML;
      if (html === h.present.html) return;
      const now = Date.now();
      const merge = !force && h.undo.length && MERGE_TYPES.includes(type) &&
                    type === h.lastType && now - h.lastT < 800 && now - h.groupStart < 2500;
      if (!merge) {
        h.undo.push(h.present);
        if (h.undo.length > HISTORY_LIMIT) h.undo.shift();
        h.groupStart = now;
      }
      h.present = { html, sel: getSelOffsets() };
      h.redo = [];
      h.lastT = now;
      h.lastType = force ? null : type;
      updateHistoryButtons();
    }

    function applySnapshot(snap) {
      editor.innerHTML = snap.html;
      pendingFontSize = null;
      const isEmpty = editor.innerText.replace(/\u200B/g, '').trim() === '';
      editor.classList.toggle('placeholder', isEmpty);
      editor.focus();
      setSelOffsets(snap.sel);
      if (isEmpty) {
        currentFontSize = 16;
        document.getElementById('fontSizeDisplay').textContent = 16;
      } else {
        detectFontSize();
      }
      updateWordCount();
      saveState();
      requestAnimationFrame(scrollCursorAboveToolbar);
    }

    function undoHistory() {
      const h = curHistory();
      if (!h || !h.undo.length) return;
      h.redo.push(h.present);
      h.present = h.undo.pop();
      h.lastType = null;
      applySnapshot(h.present);
      updateHistoryButtons();
    }
    function redoHistory() {
      const h = curHistory();
      if (!h || !h.redo.length) return;
      h.undo.push(h.present);
      h.present = h.redo.pop();
      h.lastType = null;
      applySnapshot(h.present);
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      const h = curHistory();
      document.getElementById('undoBtn').classList.toggle('is-disabled', !h || !h.undo.length);
      document.getElementById('redoBtn').classList.toggle('is-disabled', !h || !h.redo.length);
    }

    // Toolbar buttons (mousedown is cancelled so the editor keeps focus and selection)
    ['undoBtn', 'redoBtn'].forEach(id => {
      document.getElementById(id).addEventListener('mousedown', (e) => e.preventDefault());
    });
    document.getElementById('undoBtn').addEventListener('click', undoHistory);
    document.getElementById('redoBtn').addEventListener('click', redoHistory);

    // Record every edit (typing, paste, cut, formatting commands, drag & drop...)
    editor.addEventListener('input', (e) => recordHistory(e.inputType));
    // Moving the caret ends the current typing group
    editor.addEventListener('mousedown', () => { const h = curHistory(); if (h) h.lastType = null; });
    editor.addEventListener('keyup', (e) => {
      if (['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(e.key)) {
        const h = curHistory(); if (h) h.lastType = null;
      }
    });

    // Keyboard: Ctrl/Cmd+Z = undo, Ctrl/Cmd+Y or Ctrl/Cmd+Shift+Z = redo
    editor.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoHistory(); }
      else if ((k === 'z' && e.shiftKey) || (k === 'y' && !e.shiftKey)) { e.preventDefault(); redoHistory(); }
    });
    // Browser-level undo/redo (context menu, mobile keyboards) goes through ours too
    editor.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'historyUndo') { e.preventDefault(); undoHistory(); }
      else if (e.inputType === 'historyRedo') { e.preventDefault(); redoHistory(); }
    });
    // ── END UNDO / REDO ─────────────────────────────────────────────

    start();

    // Custom Tooltips
    const tooltip = document.getElementById('custom-tooltip');
    document.querySelectorAll('[title]').forEach(el => {
      const text = el.getAttribute('title');
      el.removeAttribute('title');
      el.dataset.tooltip = text;
    });

document.addEventListener('mouseover', (e) => {
      const target = e.target.closest('[data-tooltip]');
      if (!target) return;
      tooltip.textContent = target.dataset.tooltip;
      tooltip.classList.remove('tooltip-below');
      const rect = target.getBoundingClientRect();
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      let x = rect.left + rect.width / 2 - tw / 2;
      let y = rect.top - th - 8;
      if (x < 8) x = 8;
      if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
      if (y < 8) {
        y = rect.bottom + 8;
        tooltip.classList.add('tooltip-below');
      }
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.style.opacity = '1';
    });

    document.addEventListener('mouseout', (e) => {
      if (!e.target.closest('[data-tooltip]')) return;
      tooltip.style.opacity = '0';
    });
  })();
</script>
</body>
</html>
