<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free TypE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width=%22800px%22%20height=%22800px%22%20viewBox=%220%200%20100%20100%22%20xmlns=%22http://www.w3.org/2000/svg%22%20version=%221.1%22%3E%0A%3Cpath%20style=%22fill:%23333333%3B%22%20d=%22m%2066,14%20-18,16%200,9%202,1%202,-7%2014,-12%20z%20m%2028,13%20-19,16%200,8%207,3%20L%2063,72%2063,98%2085,74%2083,63%2097,49%20z%20M%2053,41%2033,58%2033,78%2039,61%2053,49%20z%22/%3E%0A%3Cpath%20style=%22fill:%23999999%3B%22%20d=%22M%2048,30%2026,20%2046,4.6%2066,14%20M%2075,43%2052,33%2071,17%2094,27%20M%2063,72%2039,61%2059,44%2082,54%20M%2033,58%2011,48%2030,31%2053,41%22/%3E%0A%3Cpath%20style=%22fill:%23cccccc%3B%22%20d=%22m%2050,40%202,-7%2023,10%200,8%20-16,-7%20-6,5%200,-8%20z%20m%20-32,1%208,-21%2022,10%200,9%20-18,-8%20z%20M%203.2,67%2011,48%20l%2022,10%200,20%206,-17%2024,11%200,26%20z%22/%3E%0A%3Cpath%20style=%22fill:none%3Bstroke:%23111111%3Bstroke-width:2%22%20d=%22m%2065,53%20c%20-2,-3%20-6,-3%20-7,-1%20-1,2%205,4%202,7%20-1,1%20-6,0%20-7,-3%20m%2019,-35%20-4,7%206,-1%200,5%208,-5%20m%20-35,-11%201,4%20m%203,-8%20c%20-2,-2%20-6,-2%20-9,1%20-2,2%200,5%204,5%203,0%207,-3%205,-6%20z%20m%20-23,29%206,3%20m%20-11,-1%2012,-4%20-3,9%22/%3E%0A%3Cpath%20style=%22fill:none%3Bstroke:%23222222%3Bstroke-width:1%22%20d=%22M%2018,41%2026,20%2046,4.6%2066,14%2066,21%20M%2032,82%2039,61%2059,44%2082,54%2085,74%2063,98%203.2,67%2011,48%2030,31%20l%2023,10%200,8%20m%20-3,-9%202,-7%2019,-16%2023,10%203,22%20-14,14%22/%3E%0A%3C/svg%3E">
<style>
  * { box-sizing: border-box; }

  :root {
    --background-color: #ffffff;
    --sidebar-bg: #ffffff;
    --text-color: #18181b;
    --border-color: #e4e4e7;
    --hover-bg-color: #f4f4f5;
    --accent-color: #3b82f6;
    --sidebar-width: 260px;
    --header-height: 60px;
    --transition-speed: 0.3s;
    --toolbar-bg: #ffffff;
    --icon-color: #000000;
  }

.dark-mode, html.dark-mode {
    --background-color: #151515;
    --sidebar-bg: #111111;
    --text-color: #fafafa;
    --border-color: #27272a;
    --hover-bg-color: #232323;
    --toolbar-bg: #151515;
    --icon-color: #ffffff;
    --active-page-bg: #343434;
  }
  :root {
    --active-page-bg: rgba(59, 130, 246, 0.1);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 0;
    margin: 0;
    background-color: var(--background-color);
    color: var(--text-color);
    height: 100vh;
    overflow: hidden;
    transition: background-color var(--transition-speed);
    display: flex;
  }

  /* Sidebar Styles */
  #sidebar {
    position: fixed;
    top: 0;
    left: calc(-1 * var(--sidebar-width));
    width: var(--sidebar-width);
    height: 100%;
    background-color: var(--sidebar-bg);
    border-right: 1px solid var(--border-color);
    z-index: 1000;
    /* no slide animation: contents appear together with the fixed sidebar buttons */
    padding: 80px 16px 20px 16px;
    display: flex;
    flex-direction: column;
  }

  #sidebar.open {
    left: 0;
  }

  .sidebar-header {
    color: #a1a1aa;
    font-size: 11px;
    /*text-transform: uppercase;*/
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 12px;
    padding-left: 12px;
  }

  /* Fixed Toggle Button */
#sidebarToggle {
    position: fixed;
    top: 18px;
    left: 20px;
    width: 28px;
    height: 28px;
    z-index: 1100;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #sidebarToggle.shifted,
  html.sb-open #sidebarToggle {
    left: calc(var(--sidebar-width) - 78px);
  }
  html.sb-open #sidebar { left: 0; }
  html.sb-open #appNameLabel { display: flex; }
  html.sb-open #addMenuBtn { display: flex; }
  html.no-anim *, html.no-anim *::before, html.no-anim *::after { transition: none !important; }
  #sidebarToggle svg {
    width: 18px;
    height: 18px;
  }
  #sidebarToggle:hover { background: var(--hover-bg-color); }
  #sidebarToggle svg { stroke: var(--icon-color); }

  /* App name label (shown top-left when sidebar is open) */
  #appNameLabel {
    position: fixed;
    top: 18px;
    left: 20px;
    height: 28px;
    display: none;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-color);
    cursor: pointer;
    user-select: none;
    z-index: 1100;
  }
  #appNameLabel.show { display: flex; }

  /* Add (New Page / New Folder) dropdown button, sits right after the sidebar toggle */
  #addMenuBtn {
    position: fixed;
    top: 18px;
    left: calc(var(--sidebar-width) - 44px);
    width: 28px;
    height: 28px;
    z-index: 1100;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #addMenuBtn.show { display: flex; }
  #addMenuBtn:hover { background: var(--hover-bg-color); }
  #addMenuBtn svg { width: 18px; height: 18px; stroke: var(--icon-color); }

  #addMenuDropdown {
    position: fixed;
    top: 50px;
    left: calc(var(--sidebar-width) - 44px);
    z-index: 1101;
  }

  /* Buttons */
.btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    width: 28px;
    height: 28px;
  }
  .btn-icon:hover { background: var(--hover-bg-color); }
  .btn-icon svg { 
    stroke: var(--icon-color);
    width: 18px;
    height: 18px;
  }

  #addPageBtn {
    background: transparent;
    border: none;
    padding: 10px 14px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    border-radius: 40px;
    color: var(--text-color);
    margin-bottom: 20px;
    transition: background 0.2s;
  }
  #addPageBtn:hover { background: var(--hover-bg-color); }

  /* Page List */
  #pagesList {
    flex: 1;
    overflow-y: auto;
  }

  .page-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 14px;
    transition: background-color 0.2s, color 0.2s;
  }
  .page-item:hover { background: var(--hover-bg-color); }
  .page-item.active {
    background-color: var(--active-page-bg);
    color: var(--accent-color);
    font-weight: 500;
  }
  .dark-mode .page-item.active {
    color: var(--text-color);
  }

  .page-item .more-btn {
    opacity: 0;
    padding: 4px;
    border-radius: 4px;
    transition: opacity 0.2s;
    background: transparent !important;
  }
  .page-item:hover .more-btn { opacity: 1; }

  /* Header */
  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--header-height);
    padding: 0 20px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    z-index: 900;
    gap: 8px;
  }


  /* App Modal */
  #appModalOverlay, #infoModalOverlay, #moveModalOverlay {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  #appModalOverlay.show, #infoModalOverlay.show, #moveModalOverlay.show { opacity: 1; pointer-events: auto; }
  #appModal, #infoModal, #moveModal {
    width: 100%;
    max-width: 400px;
    background: var(--toolbar-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 22px 22px 18px;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.25);
    transform: translateY(8px) scale(0.97);
    transition: transform 0.18s ease;
  }
  #appModalOverlay.show #appModal, #infoModalOverlay.show #infoModal, #moveModalOverlay.show #moveModal { transform: none; }
  #appModalTitle { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  #appModalMessage { margin: 0; font-size: 14px; line-height: 1.5; opacity: 0.75; word-break: break-word; }
  #appModalInput {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--text-color);
    background: var(--background-color);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #appModalInput:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }
  #appModalActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .app-modal-btn {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: none;
    color: var(--text-color);
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .app-modal-btn:hover { background: var(--hover-bg-color); }
  .app-modal-btn.primary { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
  .app-modal-btn.primary:hover { background: var(--accent-color); opacity: 0.9; }
  .app-modal-btn.danger { background: #ef4444; border-color: #ef4444; color: #fff; }
  .app-modal-btn.danger:hover { background: #ef4444; opacity: 0.9; }
  .app-modal-btn:disabled { opacity: 0.4; cursor: default; }

  /* Context Menu */
  .context-menu {
    position: fixed;
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 6px;
    width: 170px;
    display: none;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    z-index: 2000;
  }
  .context-menu.show { display: block; }
  .context-item {
    background: none;
    border: none;
    padding: 8px 10px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-color);
    border-radius: 6px;
  }
  .context-item:hover { background: var(--hover-bg-color); }

  .context-menu-separator {
    height: 1px;
    background: var(--border-color);
    margin: 6px 0;
  }
  
  #downloadContextMenu {
    width: 200px;
  }

  /* Main Content */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: padding-left var(--transition-speed);
    overflow-y: auto;
    scroll-behavior: auto;
  }

  #editor {
    flex: 1;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 100px 40px 0 40px;
    outline: none;
    font-size: 16px;
    line-height: 1.7;
    overflow-y: visible;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .editor-spacer {
    height: 80px;
    width: 100%;
    pointer-events: none;
  }

  .placeholder::before {
    content: "";
    color: #3D3D41 /*#a1a1aa*/;
    pointer-events: none;
    position: absolute;
    top: 100px;
    left: 40px;
  }
  
  #editor {
    position: relative;
  }

  /* Bottom Toolbar */
  #toolbar {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 100px;
    display: flex;
    gap: 4px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    z-index: 1000;
    max-width: 95vw;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-color) var(--border-color);
  }

  /* WebKit custom scrollbar (Chrome, Safari, Edge) */
  #toolbar::-webkit-scrollbar {
    height: 4px;
  }

  #toolbar::-webkit-scrollbar-track {
    background: var(--border-color);
    border-radius: 10px;
    margin: 0 10px;
  }

  #toolbar::-webkit-scrollbar-thumb {
    background: var(--accent-color);
    border-radius: 10px;
  }

  #toolbar::-webkit-scrollbar-thumb:hover {
    background: var(--accent-color);
    opacity: 0.8;
  }

  /* Firefox custom scrollbar */
  #toolbar {
    scrollbar-width: thin;
    scrollbar-color: var(--accent-color) var(--border-color);
  }

  .toolbar-btn {
    background: none;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-color);
    transition: background-color 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .toolbar-btn:hover { background: var(--hover-bg-color); }
.toolbar-btn.active { background: var(--hover-bg-color); color: var(--accent-color); }
.toolbar-btn { display: flex; align-items: center; justify-content: center; padding: 6px 10px; }
.toolbar-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.font-size-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; display: block; }

  .toolbar-btn.is-disabled { opacity: 0.35; cursor: default; }
  .toolbar-btn.is-disabled:hover { background: none; }

  .font-size-control {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 4px;
  }
  .font-size-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-color);
    font-size: 16px;
    font-weight: 500;
    width: 24px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .font-size-btn:hover { background: var(--hover-bg-color); }
  .font-size-display {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-color);
    min-width: 28px;
    text-align: center;
    user-select: none;
  }

  /* Custom Tooltip */
  #custom-tooltip {
    position: fixed;
    background: #18181b;
    color: #fafafa;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 9999;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

#custom-tooltip::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 4px 4px 0 4px;
    border-style: solid;
    border-color: #18181b transparent transparent transparent;
  }
  #custom-tooltip.tooltip-below::after {
    bottom: auto;
    top: -4px;
    border-width: 0 4px 4px 4px;
    border-color: transparent transparent #18181b transparent;
  }
  .dark-mode #custom-tooltip.tooltip-below::after {
    border-color: transparent transparent #fafafa transparent;
  }

  .dark-mode #custom-tooltip {
    background: #fafafa;
    color: #18181b;
  }
  .dark-mode #custom-tooltip::after {
    border-color: #fafafa transparent transparent transparent;
  }

  /* Save/Copy Alerts */
  #toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #18181b;
    color: #fff;
    padding: 8px 16px;
    border-radius: 40px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 3000;
  }
  .dark-mode #toast { background: #fafafa; color: #18181b; }

  /* Menu Dropdown */
  #menuDropdown {
    position: absolute;
    top: 60px;
    right: 20px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 8px;
    min-width: 180px;
    display: none;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
  }
  #menuDropdown.show { display: block; }
  .menu-item {
    background: none;
    border: none;
    padding: 10px 12px;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-color);
    border-radius: 8px;
  }

.menu-item:hover { background: var(--hover-bg-color); }

  .menu-item-nightlight {
    cursor: default;
    user-select: none;
    justify-content: space-between;
  }
  .nightlight-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nl-switch {
    position: relative;
    display: inline-block;
    width: 30px;
    height: 17px;
    flex-shrink: 0;
  }
  .nl-switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    z-index: 1;
  }
  .nl-switch-track {
    position: absolute;
    inset: 0;
    background: var(--border-color);
    border-radius: 999px;
    transition: background 0.2s;
  }
  .nl-switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .nl-switch input:checked ~ .nl-switch-track {
    background: #f97316;
  }
  .nl-switch input:checked ~ .nl-switch-track .nl-switch-thumb {
    transform: translateX(13px);
  }
  .nightlight-slider {
    width: 64px;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 4px;
    background: var(--border-color);
    outline: none;
    cursor: pointer;
    accent-color: #f97316;
  }
  .nightlight-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f97316;
    cursor: pointer;
  }
  .nightlight-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f97316;
    cursor: pointer;
    border: none;
  }

  /* Typeface picker */
  .typeface-check { opacity: 0; font-size: 13px; color: var(--accent-color); }
  .typeface-option.active .typeface-check { opacity: 1; }

#night-light-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    background: transparent;
    transition: background 0.4s ease;
  }

  /* Storage Indicator */
#storageIndicator {
    position: fixed;
    bottom: 14px;
    left: 20px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-color);
    opacity: 0.45;
    pointer-events: none;
    z-index: 800;
    letter-spacing: 0.01em;
    transition: opacity 0.2s;
    line-height: 1.5;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #storageIndicator:hover { opacity: 0.75; }
  #storageIndicator svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    fill: currentColor;
  }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .menu-shortcut {
    font-size: 11px;
    color: #a1a1aa;
    opacity: 0;
    transition: opacity 0.15s ease;
    white-space: nowrap;
  }
  .menu-item:hover .menu-shortcut { opacity: 1; }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: padding-left var(--transition-speed);
    overflow-y: auto;
    scroll-behavior: auto;
  }

  .editor-spacer {
    height: 80px;
    width: 100%;
    flex-shrink: 0;
    pointer-events: none;
  }

html {
    scroll-behavior: auto;
  }

  /* Custom Scrollbar — hidden unless actively scrolling */
  #main::-webkit-scrollbar {
    width: 4px;
  }
  #main::-webkit-scrollbar-track {
    background: transparent;
  }
  #main::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 999px;
    transition: background 0.3s ease;
  }
  #main.scrolling::-webkit-scrollbar-thumb {
    background: #71717a;
  }
  #main.scrolling::-webkit-scrollbar-thumb:hover {
    background: #a1a1aa;
  }
  #main {

<script>
const Utils = {
    generateUUID: function () {
        if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }
};

</script>
<script>
  (function(){
    // DB & State
    const DB_NAME = 'NotebookDB_v2';
    const DB_VERSION = 2;
    const STORE_NAME = 'state';       // 'appState' -> settings + page tree (no page bodies)
    const CONTENT_STORE = 'content';  // <pageId> -> page HTML, one record per page
    let db = null;
    
    let pages = [];
    let currentPageId = null;
    let isDarkMode = false;
    let isSidebarOpen = false;
    let contextItemId = null;
    let isCounterVisible = true;
    let isToolbarVisible = true;
    let isSpellcheckEnabled = false;
    let isNightLightEnabled = false;
    let nightLightIntensity = 40;
    let isStorageVisible = true;
    let pageCounter = 1;
    let folderCounter = 1;
    let editorTypeface = 'default';
    let searchQuery = '';
    let findMatches = [], findIdx = -1, findLastQuery = '';
    let isReadMode = false;
    let wordCountTimer = null;

    // ── Tree helpers ──────────────────────────────────────────────
    function findItemById(list, id) {
      for (const item of list) {
        if (item.id === id) return item;
        if (item.type === 'folder' && item.children) {
          const found = findItemById(item.children, id);
          if (found) return found;
        }
      }
      return null;
    }
    function findParentList(list, id, parentList) {
      for (const item of list) {
        if (item.id === id) return list;
        if (item.type === 'folder' && item.children) {
          const found = findParentList(item.children, id);
          if (found) return found;
        }
      }
      return null;
    }
    function flattenPages(list) {
      let out = [];
      for (const item of list) {
        if (item.type === 'folder') {
          if (item.children) out = out.concat(flattenPages(item.children));
        } else {
          out.push(item);
        }
      }
      return out;
    }
    function getCurrentPage() {
      return findItemById(pages, currentPageId);
    }
    // Migrate legacy data (no id/type, flat pages array, index-based) to the new model
    function ensureMeta(list, now) {
      let changed = false;
      (list || []).forEach(it => {
        if (!it.createdAt) { it.createdAt = now; changed = true; }
        if (!it.updatedAt) { it.updatedAt = it.createdAt; changed = true; }
        if (it.type === 'folder' && it.children) { if (ensureMeta(it.children, now)) changed = true; }
      });
      return changed;
    }
    function migratePages() {
      let changed = false;
      pages.forEach(p => {
        if (!p.id) { p.id = Utils.generateUUID(); changed = true; }
        if (!p.type) { p.type = 'page'; changed = true; }
      });
      if (pages.length === 0) {
        pages.push({ id: Utils.generateUUID(), type: 'page', name: 'Page 1', content: '' });
        changed = true;
      }
      if (ensureMeta(pages, Date.now())) changed = true;
      return changed;
    }
    function findParentFolder(list, id, parent) {
      for (const item of list) {
        if (item.id === id) return parent || null;
        if (item.type === 'folder' && item.children) {
          const f = findParentFolder(item.children, id, item);
          if (f !== undefined) return f;
        }
      }
      return undefined;
    }
    function touchFolder(folder) { if (folder) folder.updatedAt = Date.now(); }
    function markEdited() { const p = getCurrentPage(); if (p) p.updatedAt = Date.now(); }
    function folderPath(id) {
      const names = [];
      let f = findParentFolder(pages, id, null);
      while (f) { names.unshift(f.name); f = findParentFolder(pages, f.id, null); }
      return names;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function hexToRgba(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
    }
    // Text-only counts: works on any plain-text string (e.g. a stored page body).
    // Only U+200B is stripped (as before), so the word count logic is unchanged.
    function countText(text) {
      const t = (text || '').replace(/\u200B/g, '');
      const words = t.split(/\s+/).filter(Boolean).length;
      const charsWithSpaces = t.length;
      const charsNoSpaces = t.replace(/\s/g, '').length;
      // spaces = literal spaces and no-break spaces (tabs and line breaks are not counted)
      const spaces = (t.match(/[ \u00A0]/g) || []).length;
      // Known limitation: abbreviations ("Dr.") and decimals ("3.14") can over- or under-count
      const sentences = t.split(/[.!?]+(?=\s|$)/).filter(s => s.trim()).length;
      // Text path (stored bodies): lines and paragraphs are derived from line breaks.
      // countFromEditor() replaces them with DOM-based numbers for the live editor.
      const lines = t.trim() ? t.split(/\n/).length : 0;
      const paragraphs = t.split(/\n\s*\n/).filter(s => s.trim()).length;
      return { words, chars: charsWithSpaces, charsWithSpaces, charsNoSpaces, spaces, sentences, lines, paragraphs };
    }

    const BLOCK_TAGS = new Set(['DIV', 'P', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE', 'UL', 'OL']);
    // Live-editor path: text-based numbers plus DOM-based lines (block elements)
    // and paragraphs (top-level blocks). Falls back to the text numbers for plain, block-less content.
    function countFromEditor() {
      const c = countText(editor.innerText || '');
      if (!c.charsNoSpaces) return c;
      const first = editor.firstChild;
      const leadingInline = first && !BLOCK_TAGS.has(first.tagName) && (first.textContent || '').replace(/\u200B/g, '').trim() ? 1 : 0;
      const blocks = editor.querySelectorAll('div, p, li, h1, h2, h3, h4, h5, h6, blockquote, pre').length;
      if (blocks) c.lines = blocks + leadingInline;
      const top = Array.from(editor.children).filter(el => BLOCK_TAGS.has(el.tagName) && el.textContent.replace(/\u200B/g, '').trim()).length;
      if (top) c.paragraphs = top + leadingInline;
      return c;
    }
    const fmtNum = (n) => n.toLocaleString();


    const editor = document.getElementById('editor');
    const wordCountEl = document.getElementById('wordCount');
    const pagesList = document.getElementById('pagesList');
    const toast = document.getElementById('toast');

    // ── PERSISTENCE (IndexedDB) ─────────────────────────────────────
    // • Each page body is its own record, so typing only rewrites the page being edited
    //   (the old design re-wrote every page on every change).
    // • Writes are debounced (with a max wait) and flushed when the tab is hidden or closed.
    // • Everything that changed is written in ONE transaction, so it's all-or-nothing.
    // • Old single-record data is migrated automatically on first load.
    // • If storage can't be opened/read, autosave pauses instead of overwriting good data.
    const SAVE_DEBOUNCE = 500;     // ms of quiet before writing
    const SAVE_MAX_WAIT = 3000;    // never hold changes longer than this
    let dbMode = 'none';           // 'idb' | 'memory'
    let loadOK = false;            // true once saved data was read (or storage is intentionally absent)
    let needsMigrationSave = false;
    let storagePersisted = null;
    let dirty = false, saveTimer = null, maxTimer = null, retryTimer = null, failCount = 0;
    let writeChain = Promise.resolve();
    const savedContent = new Map();        // pageId -> content last written
    const knownContentIds = new Set();     // ids that have a content record on disk
    let savedMetaJSON = null;
    const tabId = Utils.generateUUID();
    let syncChannel = null;
    let lastSyncWarn = 0;

    function initDB() {
      return new Promise((resolve) => {
        if (!('indexedDB' in window) || !window.indexedDB) { dbMode = 'memory'; return resolve(); }
        let request;
        try { request = indexedDB.open(DB_NAME, DB_VERSION); }
        catch (e) { dbMode = 'memory'; return resolve(); }
        request.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME);
          if (!d.objectStoreNames.contains(CONTENT_STORE)) d.createObjectStore(CONTENT_STORE);
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          dbMode = 'idb';
          // Another tab wants to upgrade/delete the database: let go so it isn't blocked.
          db.onversionchange = () => {
            try { db.close(); } catch (_) {}
            db = null; loadOK = false;
            showToast('Notebook updated in another tab. Please reload.');
          };
          db.onclose = () => { db = null; };
          resolve();
        };
        request.onblocked = () => showToast('Close other Free TypE tabs to finish updating storage.');
        request.onerror = () => { dbMode = 'memory'; resolve(); };
      });
    }

    async function requestPersistence() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          storagePersisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
        }
      } catch (_) {}
    }

    function isFolderItem(it) { return it && it.type === 'folder'; }
    function stripContent(list) {
      return (list || []).map(it => {
        if (isFolderItem(it)) return Object.assign({}, it, { children: stripContent(it.children) });
        const copy = Object.assign({}, it);
        delete copy.content;
        return copy;
      });
    }
    function buildMeta() {
      return {
        schemaVersion: 2,
        pages: stripContent(pages),
        currentPageId, isDarkMode, isCounterVisible, isToolbarVisible, isSpellcheckEnabled,
        isNightLightEnabled, nightLightIntensity, isStorageVisible, pageCounter, folderCounter, editorTypeface, isSidebarOpen
      };
    }

    const ZW_SPAN = /<span[^>]*>\u200B<\/span>/g;
    // Copy the editor into the current page (zero-width anchor spans are dropped from the saved copy only)
    function captureEditor() {
      const curP = getCurrentPage();
      if (!curP) return;
      const html = editor.innerHTML;
      curP.content = html.indexOf('\u200B') === -1 ? html : html.replace(ZW_SPAN, '');
    }

    // Called after every change: capture immediately, write to disk shortly after.
    function saveState() {
      if (!loadOK) return Promise.resolve();
      captureEditor();
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, SAVE_DEBOUNCE);
      if (!maxTimer) maxTimer = setTimeout(flushSave, SAVE_MAX_WAIT);
      return Promise.resolve();
    }
    // Capture + write right now (used by backup export/import)
    async function saveNow() { await saveState(); return flushSave(); }

    async function writeNow() {
      if (!db) return;
      const metaObj = buildMeta();
      const metaJSON = JSON.stringify(metaObj);
      const ids = new Set();
      const changed = [];
      flattenPages(pages).forEach(pg => {
        ids.add(pg.id);
        const c = pg.content || '';
        if (savedContent.get(pg.id) !== c) changed.push([pg.id, c]);
      });
      const removed = [...knownContentIds].filter(id => !ids.has(id));
      const metaChanged = metaJSON !== savedMetaJSON;
      if (!changed.length && !removed.length && !metaChanged) return;

      await new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME, CONTENT_STORE], 'readwrite');
        const cs = tx.objectStore(CONTENT_STORE);
        changed.forEach(([id, c]) => cs.put(c, id));
        removed.forEach(id => cs.delete(id));
        if (metaChanged) tx.objectStore(STORE_NAME).put(metaObj, 'appState');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });

      changed.forEach(([id, c]) => { savedContent.set(id, c); knownContentIds.add(id); });
      removed.forEach(id => { savedContent.delete(id); knownContentIds.delete(id); });
      savedMetaJSON = metaJSON;
      try { if (syncChannel) syncChannel.postMessage({ tab: tabId }); } catch (_) {}
    }

    function flushSave() {
      clearTimeout(saveTimer); clearTimeout(maxTimer);
      saveTimer = maxTimer = null;
      if (!dirty) return writeChain;
      dirty = false;
      writeChain = writeChain.then(writeNow).then(() => { failCount = 0; }).catch(err => {
        console.error('Save failed:', err);
        dirty = true;
        failCount++;
        if (err && err.name === 'QuotaExceededError') showToast('Storage is full. Export a backup to keep your notes safe.');
        else if (failCount === 1) showToast('Couldn\u2019t save. Retrying\u2026');
        clearTimeout(retryTimer);
        retryTimer = setTimeout(flushSave, Math.min(30000, 1000 * Math.pow(2, failCount)));
      });
      return writeChain;
    }

    function flushOnExit() {
      if (loadOK) { captureEditor(); dirty = true; }
      flushSave();
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushOnExit();
    });
    window.addEventListener('pagehide', flushOnExit);

    try {
      if ('BroadcastChannel' in window) {
        syncChannel = new BroadcastChannel('freetype_sync');
        syncChannel.onmessage = (e) => {
          if (e.data && e.data.tab !== tabId && Date.now() - lastSyncWarn > 30000) {
            lastSyncWarn = Date.now();
            showToast('Notebook changed in another tab. Reload to see the latest.');
          }
        };
      }
    } catch (_) {}

    async function loadState() {
      if (dbMode !== 'idb' || !db) { loadOK = true; return null; }   // memory mode: nothing to read
      try {
        const [meta, keys, vals] = await new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME, CONTENT_STORE], 'readonly');
          const r1 = tx.objectStore(STORE_NAME).get('appState');
          const r2 = tx.objectStore(CONTENT_STORE).getAllKeys();
          const r3 = tx.objectStore(CONTENT_STORE).getAll();
          tx.oncomplete = () => resolve([r1.result, r2.result, r3.result]);
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error || new Error('Read aborted'));
        });
        loadOK = true;
        if (!meta) return null;

        const bodies = new Map();
        keys.forEach((k, i) => { bodies.set(k, vals[i]); knownContentIds.add(k); });
        const legacy = meta.schemaVersion !== 2;     // v1: page bodies were stored inline
        const attach = (list) => (list || []).forEach(it => {
          if (isFolderItem(it)) { attach(it.children); return; }
          if (legacy) { if (typeof it.content !== 'string') it.content = ''; }
          else { it.content = bodies.has(it.id) ? bodies.get(it.id) : ''; savedContent.set(it.id, it.content); }
        });
        attach(meta.pages);
        if (legacy) needsMigrationSave = true;       // rewrite in the new layout after startup
        return meta;
      } catch (err) {
        console.error('Load failed:', err);
        loadOK = false;   // keep autosave OFF so a blank state never overwrites real data
        showToast('Couldn\u2019t read saved notes. Autosave is paused to protect them. Try reloading.');
        return null;
      }
    }

    function collectPinned(list) {
      let out = [];
      list.forEach(it => {
        if (it.pinned) out.push(it);
        if (it.type === 'folder' && it.children) out = out.concat(collectPinned(it.children));
      });
      return out;

    function collectSearch(list, q) {
      let out = [];
      list.forEach(it => {
        if ((it.name || '').toLowerCase().includes(q)) out.push(it);
        if (it.type === 'folder' && it.children) out = out.concat(collectSearch(it.children, q));
      });
      return out;
    }

    // Download as RTF

      const pageName = getCurrentPage().name;
      const html = editor.innerHTML;

      // Convert basic HTML to RTF
      const div = document.createElement('div');
      div.innerHTML = html;

      let rtf = '{\\rtf1\\ansi\\deff0\n';
      rtf += '{\\fonttbl{\\f0 Times New Roman;}}\n';
      rtf += '{\\colortbl;\\red0\\green0\\blue0;}\n';

      function nodeToRtf(node) {
        if (node.nodeType === 3) {
          return node.textContent
            .replace(/\\/g, '\\\\')
            .replace(/\{/g, '\\{')
            .replace(/\}/g, '\\}')
            .replace(/\n/g, '\\par\n');
        }
        let out = '';
        const tag = node.nodeName.toLowerCase();
        const style = node.style || {};
        let prefix = '', suffix = '';

        if (tag === 'b' || tag === 'strong') { prefix += '\\b '; suffix = '\\b0 ' + suffix; }
        if (tag === 'i' || tag === 'em') { prefix += '\\i '; suffix = '\\i0 ' + suffix; }
        if (tag === 'u') { prefix += '\\ul '; suffix = '\\ulnone ' + suffix; }
        if (tag === 's' || tag === 'strike') { prefix += '\\strike '; suffix = '\\strike0 ' + suffix; }
        if (tag === 'p' || tag === 'div' || tag === 'br') { suffix += '\\par\n'; }
        if (tag === 'li') { prefix += '\\bullet\\tab '; suffix += '\\par\n'; }

        if (style.fontSize) {
          const pt = Math.round(parseFloat(style.fontSize) * 1.333);
          prefix += `\\fs${pt * 2} `;
        }

        out += prefix;
        node.childNodes.forEach(child => { out += nodeToRtf(child); });
        out += suffix;
        return out;
      }

      div.childNodes.forEach(child => { rtf += nodeToRtf(child); });
      rtf += '}';

      const blob = new Blob([rtf], { type: 'application/rtf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${pageName}.rtf`;

    // Share Page: system share sheet when available, otherwise copy the text
    async function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* fall through to the legacy method */ }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      return ok;
    }

    document.getElementById('shareBtn').onclick = async () => {
      const page = getCurrentPage();
      const title = (page && page.name) || 'Untitled';
      const body = (editor.innerText || '').replace(/\u200B/g, '').trim();
      if (!body) {
        showToast('Nothing to share yet');
        return;
      }
      if (navigator.share) {
        try {
          await navigator.share({ title, text: body });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;   // person closed the share sheet
          // share sheet blocked or failed: fall back to copying
        }

const STORAGE_ICON = `<svg viewBox="0 0 36 36" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><path d="M33,6.69h0c-.18-3.41-9.47-4.33-15-4.33S3,3.29,3,6.78V29.37c0,3.49,9.43,4.43,15,4.43s15-.93,15-4.43V6.78s0,0,0,0S33,6.7,33,6.69Zm-2,7.56c-.33.86-5.06,2.45-13,2.45A37.45,37.45,0,0,1,7,15.34v2.08A43.32,43.32,0,0,0,18,18.7c4,0,9.93-.48,13-2v5.17c-.33.86-5.06,2.45-13,2.45A37.45,37.45,0,0,1,7,22.92V25a43.32,43.32,0,0,0,11,1.28c4,0,9.93-.48,13-2v5.1c-.35.86-5.08,2.45-13,2.45S5.3,30.2,5,29.37V6.82C5.3,6,10,4.36,18,4.36c7.77,0,12.46,1.53,13,2.37-.52.87-5.21,2.39-13,2.39A37.6,37.6,0,0,1,7,7.76V9.85a43.53,43.53,0,0,0,11,1.27c4,0,9.93-.48,13-2Z"/><rect x="0" y="0" width="36" height="36" fill-opacity="0"/></svg>`;

    async function updateStorageIndicator() {

      if (!el || !textEl) return;

      // Inject icon once if not already present
      if (!el.querySelector('svg')) {
        el.insertAdjacentHTML('afterbegin', STORAGE_ICON);
      }

      if (!navigator.storage || !navigator.storage.estimate) {
        textEl.textContent = 'Storage unavailable';
        return;
      }
      try {
        const { usage, quota } = await navigator.storage.estimate();
        const used = formatBytes(usage || 0);
        const left = formatBytes((quota || 0) - (usage || 0));
        textEl.textContent = `${used} used · ${left} left`;

    const appModal = (() => {
      const overlay = document.getElementById('appModalOverlay');

      const msgEl   = document.getElementById('appModalMessage');
      const input   = document.getElementById('appModalInput');
      const okBtn   = document.getElementById('appModalOk');
      const cancelBtn = document.getElementById('appModalCancel');
      let done = null;

      function close(result) {
        if (!done) return;
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
        const cb = done; done = null;
        cb(result);
      }

      // opts: { title, message, confirmText, cancelText (null = no cancel button), danger, input: { value, placeholder } }
      function open(opts) {
        if (done) close(null);
        titleEl.textContent = opts.title || '';
        msgEl.textContent = opts.message || '';
        msgEl.style.display = opts.message ? '' : 'none';
        okBtn.textContent = opts.confirmText || 'OK';
        okBtn.className = 'app-modal-btn ' + (opts.danger ? 'danger' : 'primary');
        cancelBtn.textContent = opts.cancelText || 'Cancel';
        cancelBtn.style.display = opts.cancelText === null ? 'none' : '';
        const hasInput = !!opts.input;
        input.style.display = hasInput ? '' : 'none';
        if (hasInput) {
          input.value = opts.input.value || '';
          input.placeholder = opts.input.placeholder || '';
        }
        const validate = () => { okBtn.disabled = hasInput && input.value.trim() === ''; };
        input.oninput = validate;
        validate();

        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        setTimeout(() => {
          if (hasInput) { input.focus(); input.select(); } else { okBtn.focus(); }
        }, 30);

        return new Promise(resolve => {
          done = resolve;
          okBtn.onclick = () => { if (!okBtn.disabled) close(hasInput ? input.value.trim() : true); };
          cancelBtn.onclick = () => close(hasInput ? null : false);
          overlay.onmousedown = (e) => { if (e.target === overlay) close(hasInput ? null : false); };
          overlay.onkeydown = (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') { e.preventDefault(); close(hasInput ? null : false); }
            else if (e.key === 'Enter' && e.target !== cancelBtn) { e.preventDefault(); okBtn.click(); }
            else if (e.key === 'Tab') {
              const f = [input, cancelBtn, okBtn].filter(el => el.style.display !== 'none' && !el.disabled);
              if (!f.length) return;
              const i = f.indexOf(document.activeElement);
              e.preventDefault();
              f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
            }
          };
        });
      }

      return {
        alert:   (title, message) => open({ title, message, cancelText: null }).then(() => undefined),
        confirm: (title, message, confirmText, danger) => open({ title, message, confirmText, danger }),
        prompt:  (title, value, confirmText, placeholder) => open({ title, confirmText, input: { value, placeholder } })

// Font Size Control
    let currentFontSize = 16;
    let pendingFontSize = null;
    const MIN_FONT = 1;
    const MAX_FONT = 30;

    // Text nodes that actually have selected characters, in document order.
    function selectedTextNodes(range) {
      const root = range.commonAncestorContainer;
      const out = [];
      const consider = (n) => {
        let from = 0, to = n.nodeValue.length;
        if (n === range.startContainer) from = range.startOffset;
        if (n === range.endContainer) to = range.endOffset;
        if (to > from) out.push({ node: n, from, to });
      };
      if (root.nodeType === 3) { consider(root); return out; }
      const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => range.intersectsNode(n) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
      });
      let n;
      while ((n = w.nextNode())) consider(n);
      return out;
    }

    function selectionBaseSize() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount || sel.isCollapsed || !editor.contains(sel.anchorNode)) return null;
      const first = selectedTextNodes(sel.getRangeAt(0))[0];
      if (!first || !first.node.parentElement) return null;
      const s = parseFloat(window.getComputedStyle(first.node.parentElement).fontSize);
      return isNaN(s) ? null : Math.round(s);
    }

    function applyFontSize(size) {
      currentFontSize = Math.min(MAX_FONT, Math.max(MIN_FONT, size));
      document.getElementById('fontSizeDisplay').textContent = currentFontSize;
      const px = currentFontSize + 'px';
      editor.focus();

      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed && editor.contains(sel.anchorNode)) {
        const range = sel.getRangeAt(0);
        const parts = selectedTextNodes(range);
        const targets = [];
        // Split off exactly the selected characters of each text node
        parts.forEach(({ node, from, to }) => {
          let n = node;

    function detectFontSize() {

editor.addEventListener('input', () => {

    // ── UNDO / REDO ─────────────────────────────────────────────────
    // Custom per-page history. Native undo can't track the font-size

    const histories = new Map();          // pageId -> { undo, redo, present, lastT, lastType, groupStart }
    const HISTORY_LIMIT = 100;
    const MERGE_TYPES = ['insertText', 'insertCompositionText', 'deleteContentBackward', 'deleteContentForward'];

    function textOffset(node, off) {
      const r = document.createRange();
      r.selectNodeContents(editor);
      try { r.setEnd(node, off); } catch (_) { return 0; }

    }
    function getSelOffsets() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
      const r = sel.getRangeAt(0);
      return { s: textOffset(r.startContainer, r.startOffset), e: textOffset(r.endContainer, r.endOffset) };
    }
    function locate(offset) {
      const w = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
      let n = 0, t, last = null;
      while ((t = w.nextNode())) {
        last = t;
        if (offset <= n + t.nodeValue.length) return { node: t, off: offset - n };
        n += t.nodeValue.length;
      }
      return last ? { node: last, off: last.nodeValue.length } : { node: editor, off: 0 };

        const a = locate(o.s), b = locate(o.e);

        r.setEnd(b.node, b.off);

    function initHistory() {

      if (!h || h.present.html !== editor.innerHTML) {
        h = { undo: [], redo: [], present: { html: editor.innerHTML, sel: null }, lastT: 0, lastType: null, groupStart: 0 };
        histories.set(currentPageId, h);
      }
      h.lastType = null;
      updateHistoryButtons();
    }

    function recordHistory(type, force) {
      const h = curHistory();
      if (!h) return;
      const html = editor.innerHTML;
      if (html === h.present.html) return;
      const now = Date.now();
      const merge = !force && h.undo.length && MERGE_TYPES.includes(type) &&
                    type === h.lastType && now - h.lastT < 800 && now - h.groupStart < 2500;
      if (!merge) {

      editor.focus();

    document.getElementById('duplicatePageBtn').onclick = () => {

    const moveOverlay = document.getElementById('moveModalOverlay');

    const moveOkBtn = document.getElementById('moveOkBtn');
    const FOLDER_SVG = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>';
    let moveItemId = null, moveTargetId = null;

    // ── METRICS POPOVER ─────────────────────────────────────────────

      const r = wordCountEl.getBoundingClientRect();
      const pw = metricsPopover.offsetWidth, ph = metricsPopover.offsetHeight;
      const left = Math.max(8, Math.min(r.right - pw, window.innerWidth - pw - 8));
      // The counter sits at the bottom, so open upward; flip below if there is no room
      let top = r.top - ph - 8;
      if (top < 8) top = Math.min(r.bottom + 8, window.innerHeight - ph - 8);
      metricsPopover.style.left = left + 'px';
      metricsPopover.style.top = Math.max(8, top) + 'px';
    }
    function closeMetricsPopover() {
      metricsPopover.classList.remove('show');
      wordCountEl.setAttribute('aria-expanded', 'false');
    }
    function openMetricsPopover() {
      renderMetricsPopover();
      metricsPopover.classList.add('show');
      wordCountEl.setAttribute('aria-expanded', 'true');
      positionMetricsPopover();
    }
    wordCountEl.addEventListener('click', () => { isMetricsOpen() ? closeMetricsPopover() : openMetricsPopover(); });
    // Keep the editor's focus and selection while using the counter / popover
    wordCountEl.addEventListener('mousedown', (e) => e.preventDefault());
    metricsPopover.addEventListener('mousedown', (e) => e.preventDefault());
    window.addEventListener('resize', closeMetricsPopover);

    // ── TOOLBAR DROPDOWNS (align / list) ────────────────────────────
    const alignBtn = document.getElementById('alignBtn');
    const alignPopover = document.getElementById('alignPopover');
    const listBtn = document.getElementById('listBtn');
    const listPopover = document.getElementById('listPopover');
    const ALIGN_ICONS = {
      justifyLeft: '<path d="M21 5H3"/><path d="M15 12H3"/><path d="M17 19H3"/>',
      justifyCenter: '<path d="M21 5H3"/><path d="M17 12H7"/><path d="M19 19H5"/>',
      justifyRight: '<path d="M21 5H3"/><path d="M21 12H9"/><path d="M21 19H7"/>',
      justifyFull: '<path d="M21 5H3"/><path d="M21 12H3"/><path d="M21 19H3"/>'
    };
    const LIST_ICONS = {
      insertUnorderedList: '<path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/>',
      insertOrderedList: '<path d="M11 6h10"/><path d="M11 12h10"/><path d="M11 18h10"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>'
    };
    function closeToolbarPopovers() {
      alignPopover.classList.remove('show');
      listPopover.classList.remove('show');
    }
    function toggleToolbarPopover(pop, btn) {
      const wasOpen = pop.classList.contains('show');
      closeToolbarPopovers();
      if (wasOpen || isReadMode) return;
      pop.classList.add('show');
      const r = btn.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      pop.style.left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 8)) + 'px';
      pop.style.top = Math.max(8, r.top - ph - 8) + 'px';
    }
    [alignBtn, listBtn, alignPopover, listPopover].forEach(el => el.addEventListener('mousedown', (e) => e.preventDefault()));
    alignBtn.addEventListener('click', () => toggleToolbarPopover(alignPopover, alignBtn));
    listBtn.addEventListener('click', () => toggleToolbarPopover(listPopover, listBtn));
    document.querySelectorAll('.tb-pop-btn').forEach(b => {
      b.addEventListener('click', () => {
        closeToolbarPopovers();
        window.execCmd(b.dataset.cmd);
      });
    });
    function cmdState(cmd) {
      try { return document.queryCommandState(cmd); } catch (_) { return false; }
    }
    // Make the toolbar icons mirror the formatting at the caret
    function updateToolbarState() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount || !editor.contains(sel.anchorNode)) return;
      let align = 'justifyLeft';
      for (const c of ['justifyCenter', 'justifyRight', 'justifyFull']) { if (cmdState(c)) { align = c; break; } }
      document.getElementById('alignIcon').innerHTML = ALIGN_ICONS[align];
      alignPopover.querySelectorAll('.tb-pop-btn').forEach(b => b.classList.toggle('active', b.dataset.cmd === align));
      const list = cmdState('insertOrderedList') ? 'insertOrderedList' : (cmdState('insertUnorderedList') ? 'insertUnorderedList' : null);
      document.getElementById('listIcon').innerHTML = LIST_ICONS[list || 'insertUnorderedList'];
      listBtn.classList.toggle('active', !!list);
      listPopover.querySelectorAll('.tb-pop-btn').forEach(b => b.classList.toggle('active', b.dataset.cmd === list));
    }
    // One coalesced pass per frame instead of one per selectionchange event
    let selWorkQueued = false;
    function scheduleSelectionWork() {
      if (selWorkQueued) return;
      selWorkQueued = true;
      requestAnimationFrame(() => { selWorkQueued = false; detectFontSize(); updateToolbarState(); });
    }

    // ── READ / EDIT MODE ────────────────────────────────────────────
    const modeBtn = document.getElementById('modeBtn');
    function setReadMode(on) {
      isReadMode = on;
      editor.contentEditable = on ? 'false' : 'true';
      document.body.classList.toggle('read-mode', on);
      document.getElementById('toolbar').inert = on;
      closeToolbarPopovers();
      document.getElementById('modeLabel').textContent = on ? 'Read' : 'Edit';
      document.getElementById('modeIcon').innerHTML = on
        ? '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'
        : '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>';
      modeBtn.dataset.tooltip = on ? 'Switch to edit mode' : 'Switch to read mode';
      if (on) {
        const sel = window.getSelection();
        if (sel && sel.rangeCount && editor.contains(sel.anchorNode)) sel.removeAllRanges();
        editor.blur();
      } else {
        editor.focus();
      }
    }
    modeBtn.addEventListener('click', () => setReadMode(!isReadMode));

    // ── KEYBOARD SHORTCUTS ──────────────────────────────────────────
    // e.code (physical key) keeps these working with Caps Lock or any keyboard layout;
    // capture phase so they also fire while an input has focus. Always preventDefault.
    const ALT_SHORTCUTS = { KeyW: toggleCounter, KeyT: toggleToolbar, KeyD: toggleTheme, KeyS: toggleSpellcheck };
    const CTRL_SHIFT_SHORTCUTS = { KeyF: toggleFullscreen, KeyN: toggleNightLight };
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') { closeMetricsPopover(); closeToolbarPopovers(); return; }
      if (e.isComposing) return;
      let fn = null;
      if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) fn = ALT_SHORTCUTS[e.code];
      else if (e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey) fn = CTRL_SHIFT_SHORTCUTS[e.code];
      if (!fn) return;
      e.preventDefault();
      if (!e.repeat) fn();
    }, true);

    start();

    // Custom Tooltips
    const tooltip = document.getElementById('custom-tooltip');
    document.querySelectorAll('[title]').forEach(el => {
      const text = el.getAttribute('title');
      el.removeAttribute('title');
      el.dataset.tooltip = text;
    });

document.addEventListener('mouseover', (e) => {
      const target = e.target.closest('[data-tooltip]');
      if (!target) return;
      tooltip.textContent = target.dataset.tooltip;
      tooltip.classList.remove('tooltip-below');
      const rect = target.getBoundingClientRect();
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      let x = rect.left + rect.width / 2 - tw / 2;
      let y = rect.top - th - 8;
      if (x < 8) x = 8;
      if (x + tw > window.innerWidth - 8) x = window.innerWidth - tw - 8;
      if (y < 8) {
        y = rect.bottom + 8;
        tooltip.classList.add('tooltip-below');
      }
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.style.opacity = '1';
    });

    document.addEventListener('mouseout', (e) => {
      if (!e.target.closest('[data-tooltip]')) return;
      tooltip.style.opacity = '0';
    });
  })();
</script>
</body>
</html>
